<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Nuzlocke Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=20260525c" />
    <link rel="stylesheet" href="points_shop.css?v=20260526i" />
  </head>
  <body>
    <main class="overlay-shell" id="overlayRoot">
      <div class="status-strip" id="statusStrip" aria-live="polite" data-mode="loading">
        <p class="status" id="statusLine">Waiting for state data...</p>
      </div>

      <section class="zone party-zone" aria-label="Current Party">
        <div class="pokemon-grid party-grid" id="partyGrid"></div>
      </section>

      <section class="zone pc-zone" aria-label="PC Reserves">
        <div class="pokemon-grid pc-grid" id="pcGrid"></div>
      </section>

      <section class="zone memorial-zone" aria-label="Memorial Box">
        <div class="pokemon-grid dead-grid" id="deadGrid"></div>
      </section>

      <button class="points-badge-button" id="pointsBadgeButton" type="button" aria-label="Open points shop">
        <span class="points-badge-count" id="pointsBadgeValue">0</span>
      </button>
    </main>

    <template id="pokemonCardTemplate">
      <figure class="pokemon-token" data-key="">
        <span class="sprite-frame">
          <img class="sprite" alt="Pokemon sprite" />
        </span>
      </figure>
    </template>

    <script src="points_shop.js?v=20260526m"></script>
    <script src="overlay.js?v=20260526h"></script>
  </body>
</html>
